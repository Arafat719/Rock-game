<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    
    <div class="nav"><h1>Rock Paper Scissors</h1></div>
    <div class="container">
        <div class="rock image"></div>
        <div class="paper image"></div>
        <div class="scissors image"></div>
    </div>

    <div class="main">
        <div class="box"><i class="fa-solid fa-user"></i></div>
        <div class="box"><i class="fa-solid fa-desktop"></i></div>
    </div>

    <div class="main-sec">
       <div class="userCore"><h1>0</h1></div>
        <div class="compCore"><h1>0</h1></div>
    </div>

    <div class="mess">
        <div class="win"><h1>Play</h1></div>
        <h2></h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
